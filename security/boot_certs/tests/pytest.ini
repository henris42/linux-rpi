[pytest]
# Pytest configuration for boot certificate tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    kernel: Integration tests requiring loaded kernel module
    slow: Slow-running tests
    est: Tests requiring EST service (future)
    rest: Tests requiring REST API service (future)

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    --code-highlight=yes
    -ra

# Coverage (when run with --cov)
[coverage:run]
source = .
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Timeout (prevent hanging tests)
timeout = 300
timeout_method = thread
