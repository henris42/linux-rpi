[pytest]
# Pytest configuration for boot certificate tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    kernel: Integration tests requiring loaded kernel module
    signing: Module signing tests (ECC + FALCON)
    slow: Slow-running tests
    est: Tests requiring EST service (optional)

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    --code-highlight=yes
    -ra

# Timeout (prevent hanging tests)
timeout = 300
timeout_method = thread
